[project]
name = "nlp-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Suryansh0911", email = "suryanshgupta0911@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "dataset>=2.0.0",
    "datasets>=5.0.1",
    "peft>=0.20.0",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "trl>=1.10.0",
]

[project.scripts]
nlp-toolkit = "nlp_toolkit:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
